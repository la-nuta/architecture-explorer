<div class="diagram-wrapper">
  <svg
    class="diagram-svg"
    [attr.viewBox]="viewBox()"
    [attr.height]="svgHeight()"
    xmlns="http://www.w3.org/2000/svg"
    aria-label="Architecture diagram"
  >
    <defs>
      <!-- Arrow marker for connections -->
      <marker
        [attr.id]="arrowId"
        markerWidth="8"
        markerHeight="8"
        refX="6"
        refY="3"
        orient="auto"
      >
        <path d="M0,0 L0,6 L8,3 z" fill="#7c3aed" opacity="0.8" />
      </marker>
      <!-- Glow filter -->
      <filter [attr.id]="glowId" x="-20%" y="-20%" width="140%" height="140%">
        <feGaussianBlur stdDeviation="2" result="coloredBlur" />
        <feMerge>
          <feMergeNode in="coloredBlur" />
          <feMergeNode in="SourceGraphic" />
        </feMerge>
      </filter>
    </defs>

    <!-- Connection lines -->
    @for (edge of layout().edges; track edge.fromId + '-' + edge.toId) {
      <line
        class="edge-line"
        [attr.x1]="edge.x1"
        [attr.y1]="edge.y1"
        [attr.x2]="edge.x2"
        [attr.y2]="edge.y2 - 4"
        [attr.marker-end]="'url(#' + arrowId + ')'"
        [attr.filter]="'url(#' + glowId + ')'"
      />
    }

    <!-- Nodes -->
    @for (node of layout().layoutNodes; track node.id) {
      <g class="diagram-node" [attr.transform]="'translate(' + node.x + ',' + node.y + ')'">
        <!-- Node box -->
        <rect
          [attr.width]="node.width"
          [attr.height]="node.height"
          [attr.rx]="nodeRx(node.type)"
          [attr.fill]="nodeFill(node.type)"
          [attr.stroke]="nodeStroke(node.type)"
          [attr.stroke-dasharray]="nodeStrokeDasharray(node.type)"
          stroke-width="1.5"
          [attr.filter]="'url(#' + glowId + ')'"
          class="node-rect"
        />

        <!-- Node type indicator dot -->
        <circle
          cx="10"
          cy="10"
          r="3"
          [attr.fill]="nodeStroke(node.type)"
          opacity="0.9"
        />

        <!-- Node label — support multi-line via \n split -->
        @if (nodeLabel(node.label).length === 1) {
          <text
            [attr.x]="node.width / 2"
            [attr.y]="node.height / 2 + 1"
            text-anchor="middle"
            dominant-baseline="middle"
            [attr.fill]="nodeTextColor(node.type)"
            class="node-label"
          >{{ node.label }}</text>
        }
        @if (nodeLabel(node.label).length > 1) {
          @for (line of nodeLabel(node.label); track $index) {
            <text
              [attr.x]="node.width / 2"
              [attr.y]="node.height / 2 - (nodeLabel(node.label).length - 1) * 7 + $index * 14"
              text-anchor="middle"
              dominant-baseline="middle"
              [attr.fill]="nodeTextColor(node.type)"
              class="node-label"
            >{{ line }}</text>
          }
        }
      </g>
    }
  </svg>
</div>
